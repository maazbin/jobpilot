name: Self-evolve PR review

# Reviews every pull request (especially automated self-evolution PRs JobPilot opens).
# Three gates must pass before merge:
#   1. Security gate  — no personal data, credentials, or out-of-allowlist paths
#   2. Syntax check   — every changed JS file parses without errors
#   3. Boot smoke     — the MCP server still loads and registers all tools
#
# Clean self-evolve PRs auto-merge once all three pass.

on:
  pull_request:
    branches: [ main ]
  # Also run when a PR is labelled (in case label is added after creation)
  pull_request_target:
    types: [ labeled ]
    branches: [ main ]

permissions:
  contents: write
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    # Don't run twice on the same event
    if: github.event_name == 'pull_request' || github.event.label.name == 'self-evolve'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # For pull_request_target we need the PR head
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 1) SECURITY GATE — no personal data, credentials, or out-of-allowlist paths.
      - name: Security gate
        run: node scripts/ci-security-scan.mjs

      # 2) Syntax-check every changed JS/MJS file.
      - name: Syntax check changed JS
        run: |
          git fetch origin "${{ github.base_ref || 'main' }}" --depth=1
          files=$(git diff --name-only "origin/${{ github.base_ref || 'main' }}...HEAD" | grep -E '\.m?js$' || true)
          for f in $files; do
            [ -f "$f" ] && echo "checking $f" && node --check "$f"
          done

      # 3) Server must still boot (imports resolve, tools register).
      - name: Boot smoke test
        run: |
          npm ci --no-audit --no-fund
          node -e "
            import('./mcp-server.js')
              .then(() => { console.log('MCP boot OK'); process.exit(0); })
              .catch(e => { console.error(e); process.exit(1); })
          "
        env:
          CI: "true"

  automerge:
    needs: review
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.labels.*.name, 'self-evolve')
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge clean self-evolve PR
        run: |
          gh pr merge --squash --auto "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # After merging, ensure the base branch is up to date
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Fast-forward main to latest
        run: |
          git fetch origin main
          git merge --ff-only origin/main || true
